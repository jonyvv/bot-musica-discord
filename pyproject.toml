[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services/bot/src", "services/resolver/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "D102", "D103", "D200", "D400"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"tests/**" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services"]
pythonpath = ["services/bot/src", "services/resolver/src", "scripts"]
addopts = "--import-mode=importlib -q"
